worker_processes 1;

pid /home/vit6556/MEPhI/sysadmin/hw2-lab/nginx/nginx.pid;
error_log /home/vit6556/MEPhI/sysadmin/hw2-lab/nginx/error.log;

events {
    worker_connections 128;
}

http {
    access_log /home/vit6556/MEPhI/sysadmin/hw2-lab/nginx/access.log;

    server {
        listen 127.0.0.1:80;
        server_name localhost;

        return 301 https://localhost$request_uri;
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name localhost;

        ssl_certificate /home/vit6556/MEPhI/sysadmin/hw2-lab/nginx/my-app.crt;
        ssl_certificate_key /home/vit6556/MEPhI/sysadmin/hw2-lab/nginx/my-app.key;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
    }
}
